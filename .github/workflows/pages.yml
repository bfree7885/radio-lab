name: Deploy learner site

# Publishes only dist/learner. Flask, Python, SQLite, and the local NCVEC PDF
# stay out of the site. The document root is that directory, so /labs/, /content/,
# and /web/ resolve on the public host.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the local app so the static build can render it
        run: pip install -r requirements.txt

      - name: Build the hosted learner site
        run: python -m labs.build_hosted

      - name: Mark the site root for GitHub Pages
        run: |
          printf '%s\n' radio.waypointstudio.org > dist/learner/CNAME
          touch dist/learner/.nojekyll
          if find dist/learner -name '*.pdf' -o -name '*.sqlite' -o -name '*.py' | grep -q .; then
            echo "Learner output contains a file that must not be published."
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/learner

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
